<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISKALA-RS - Struktur & Skala Upah</title>
<style>
:root{--pri:#1f4e5f;--pri2:#2d6a80;--bg:#f3f6f8;--card:#fff;--line:#d9e2e7;--txt:#1d2b32;--mut:#5f7480;--ok:#2e7d4f;--warn:#b26a00;--err:#b3261e;--okbg:#e8f3ec;--warnbg:#fff4e0;--errbg:#fdecea}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:var(--txt);background:var(--bg)}
h1,h2,h3{margin:0 0 10px;color:var(--pri)}
h2{font-size:20px}h3{font-size:16px}
small,.mut{color:var(--mut)}
button,input,select,textarea{font:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--pri2)}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.warn{background:var(--warn)}.btn.err{background:var(--err)}.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%}
input[type=checkbox]{width:auto}
label.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
label.fld span{font-weight:bold;font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.cards .card{margin:0}
.stat{font-size:22px;font-weight:bold;color:var(--pri)}
.statl{font-size:12px;color:var(--mut)}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--pri);color:#fff;font-size:12px;white-space:nowrap}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
tr.tot td{font-weight:bold;background:#eef3f5}
.wrap{overflow-x:auto;margin-bottom:14px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.b-Draft{background:#e6eaed;color:#42535c}.b-Diajukan{background:var(--warnbg);color:var(--warn)}
.b-Disetujui{background:var(--okbg);color:var(--ok)}.b-Ditolak{background:var(--errbg);color:var(--err)}
.pos-bawah{color:var(--err);font-weight:bold}.pos-dalam{color:var(--ok)}.pos-atas{color:var(--warn);font-weight:bold}
/* shell */
#login{max-width:360px;margin:9vh auto;padding:0 16px}
.side{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--pri);color:#fff;display:flex;flex-direction:column;z-index:5;transition:transform .2s}
.side h1{color:#fff;font-size:17px;padding:16px 16px 2px;margin:0}
.side .sub{padding:0 16px 12px;font-size:11px;color:#b9d2db}
.side nav{flex:1;overflow:auto}
.side nav a{display:block;padding:10px 16px;color:#dbe9ee;text-decoration:none;cursor:pointer;border-left:4px solid transparent}
.side nav a:hover{background:#2a6074}
.side nav a.on{background:#2a6074;border-left-color:#ffd166;color:#fff;font-weight:bold}
.side .me{padding:12px 16px;border-top:1px solid #3b6b7d;font-size:12px}
.side .me button{margin-top:6px;margin-right:4px}
.main{margin-left:236px;padding:20px;min-height:100vh}
.top{display:none;background:var(--pri);color:#fff;padding:10px 14px;align-items:center;gap:10px;position:sticky;top:0;z-index:4}
.top button{background:transparent;border:1px solid #fff;color:#fff;border-radius:6px;padding:4px 10px}
@media(max-width:860px){.side{transform:translateX(-100%)}.side.open{transform:none}.main{margin-left:0;padding:12px}.top{display:flex}.grid2,.grid3{grid-template-columns:1fr}}
#toast{position:fixed;right:14px;bottom:14px;z-index:99;display:flex;flex-direction:column;gap:8px}
.tst{background:#222;color:#fff;padding:10px 14px;border-radius:8px;max-width:340px}
.tst.err{background:var(--err)}.tst.ok{background:var(--ok)}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:98;font-weight:bold;color:var(--pri)}
dialog{border:0;border-radius:12px;padding:20px;max-width:640px;width:94vw;box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.bar{height:14px;background:#dfe9ee;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri2)}
.note{background:var(--warnbg);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;margin-bottom:14px}
.info{background:#e8f1f5;border-left:4px solid var(--pri2);padding:10px 12px;border-radius:6px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row>*{width:auto}
code,pre{background:#eef3f5;border-radius:6px;font-family:Consolas,monospace;font-size:12px}
pre{padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-all}
td select{min-width:54px;padding:4px}
.wrap table.stk th:first-child,.wrap table.stk td:first-child{position:sticky;left:0;z-index:2;box-shadow:2px 0 0 var(--line)}
.wrap table.stk td:first-child{background:#fff}
.wrap table.stk th:first-child{z-index:3}
#jtab th{white-space:normal;min-width:84px;line-height:1.25}
#jtab td:first-child{min-width:190px}

@media print{.side,.top,.noprint,#toast{display:none!important}.main{margin:0;padding:0}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="loading">Memproses...</div>
<dialog id="dlg"></dialog>

<script>
/* ===================================================================
   SISKALA-RS - Frontend
   PULIHKAN setelah setiap penggantian file: isi API_URL dengan URL Web App (/exec)
   =================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycby5w3XqmNIRKnCkNQ6REWJok6_9GM-1NOZ_oqnlV1kHx68UKmM_7O3MKi2z92UCQkO-/exec';

const S = { token: sessionStorage.getItem('sk_token') || '', user: null, boot: null, page: 'dash' };
try { S.user = JSON.parse(sessionStorage.getItem('sk_user') || 'null'); } catch (e) { S.user = null; }

/* ---------------------------------------------------------------- util */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => (n === '' || n == null || isNaN(n)) ? '-' : Math.round(n).toLocaleString('id-ID');
const rp = n => (n === '' || n == null || isNaN(n)) ? '-' : 'Rp ' + Math.round(n).toLocaleString('id-ID');
const pct = (x, d) => (x * 100).toFixed(d == null ? 1 : d).replace('.', ',') + '%';
const D = ['sen', 'sel', 'rab', 'kam', 'jum', 'sab', 'min'];
const DN = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
const STAFF = ['SuperAdmin', 'HRD', 'Keuangan', 'Wadir', 'Direktur'];
const can = (...roles) => S.user && (S.user.role === 'SuperAdmin' || roles.indexOf(S.user.role) >= 0);
const isStaff = () => S.user && STAFF.indexOf(S.user.role) >= 0;
const curPeriode = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const today = () => new Date().toISOString().slice(0, 10);

let busyN = 0;
function busy(d) { busyN += d; $('#loading').style.display = busyN > 0 ? 'flex' : 'none'; }
function toast(msg, type) {
  const t = document.createElement('div'); t.className = 'tst ' + (type || ''); t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), type === 'err' ? 7000 : 3500);
}
async function api(action, data, opts) {
  opts = opts || {};
  if (API_URL === 'API_URL') throw new Error('API_URL belum diisi. Edit index.html dan pasang URL Web App Apps Script.');
  if (!opts.quiet) busy(1);
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: S.token, data: data || {} }) });
    const j = await res.json();
    if (!j.ok) { if (/Sesi berakhir/.test(j.error)) { logoutLocal(); } throw new Error(j.error); }
    return j.data;
  } finally { if (!opts.quiet) busy(-1); }
}
async function run(fn) { try { return await fn(); } catch (e) { toast(e.message, 'err'); } }
function closeDlg() { const d = $('#dlg'); if (d.open) d.close(); }

function field(f, v) {
  const val = v !== undefined && v !== null ? v : (f.def !== undefined ? f.def : '');
  let inp;
  if (f.type === 'select') inp = `<select name="${f.k}">${f.opts.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(val) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if (f.type === 'textarea') inp = `<textarea name="${f.k}" rows="3">${esc(val)}</textarea>`;
  else inp = `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(val)}" ${f.step ? `step="${f.step}"` : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.req ? 'required' : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;
  return `<label class="fld"><span>${esc(f.label)}</span>${inp}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</label>`;
}
function openForm(title, fields, values, onSubmit, saveLabel) {
  const d = $('#dlg');
  d.innerHTML = `<form id="dform"><h3>${esc(title)}</h3><div class="grid2">${fields.map(f => field(f, values ? values[f.k] : undefined)).join('')}</div><div class="dlg-actions"><button type="button" class="btn ghost" onclick="closeDlg()">Batal</button><button class="btn" type="submit">${esc(saveLabel || 'Simpan')}</button></div></form>`;
  d.showModal();
  $('#dform').onsubmit = async ev => {
    ev.preventDefault(); const o = {}; new FormData(ev.target).forEach((v, k) => { o[k] = v; });
    try { await onSubmit(o); closeDlg(); } catch (e) { toast(e.message, 'err'); }
  };
}
function csvDownload(name, rows) {
  const t = rows.map(r => r.map(v => { const s = String(v == null ? '' : v); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + t], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const gol = k => (S.boot.struktur.filter(g => g.kode === k)[0]) || null;
const jabAktif = () => S.boot.jabatan.filter(j => j.aktif !== 'N');

/* ---------------------------------------------------------------- shell */
const MENU = [
  { id: 'dash', label: 'Dashboard', ok: () => isStaff() },
  { id: 'struktur', label: 'Struktur & Skala Upah', ok: () => isStaff() },
  { id: 'jabatan', label: 'Evaluasi Jabatan', ok: () => isStaff() },
  { id: 'manajer', label: 'Manajer & Jadwal Jam', ok: () => isStaff() },
  { id: 'kalk', label: 'Kalkulator Upah', ok: () => isStaff() },
  { id: 'penetapan', label: 'Penetapan & Persetujuan', ok: () => isStaff() },
  { id: 'laporan', label: 'Laporan Biaya', ok: () => isStaff() },
  { id: 'import', label: 'Import & Integrasi', ok: () => can('HRD') },
  { id: 'setting', label: 'Pengaturan', ok: () => can('Keuangan') },
  { id: 'pengguna', label: 'Pengguna & Audit', ok: () => can() },
  { id: 'saya', label: 'Data Saya', ok: () => S.user && S.user.role === 'Manajer' }
];

function showLogin() {
  $('#app').innerHTML = `<div id="login"><div class="card"><h1>SISKALA-RS</h1><p class="mut">Sistem Struktur & Skala Upah Manajer<br>RSU Allam Medica</p>
  <label class="fld"><span>Username</span><input id="lu" autocomplete="username"></label>
  <label class="fld"><span>PIN</span><input id="lp" type="password" inputmode="numeric" autocomplete="current-password"></label>
  <button class="btn" style="width:100%" onclick="doLogin()">Masuk</button>
  <p><small>Data upah bersifat rahasia. Akses dicatat dalam audit.</small></p></div></div>`;
  $('#lp').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}
function doLogin() {
  run(async () => {
    const r = await api('login', { username: $('#lu').value, pin: $('#lp').value });
    S.token = r.token; S.user = r.user;
    sessionStorage.setItem('sk_token', r.token); sessionStorage.setItem('sk_user', JSON.stringify(r.user));
    S.page = S.user.role === 'Manajer' ? 'saya' : 'dash';
    await start();
  });
}
function logoutLocal() {
  sessionStorage.removeItem('sk_token'); sessionStorage.removeItem('sk_user');
  S.token = ''; S.user = null; S.boot = null; showLogin();
}
async function doLogout() { try { await api('logout', {}, { quiet: true }); } catch (e) { /* abaikan */ } logoutLocal(); }

async function start() {
  if (isStaff()) S.boot = await api('bootstrap');
  shell();
}
function shell() {
  const items = MENU.filter(m => m.ok());
  $('#app').innerHTML = `<div class="top"><button onclick="document.querySelector('.side').classList.toggle('open')">Menu</button><b>SISKALA-RS</b></div>
  <aside class="side"><h1>SISKALA-RS</h1><div class="sub">Struktur & Skala Upah Manajer</div>
  <nav>${items.map(m => `<a data-p="${m.id}" onclick="go('${m.id}')">${esc(m.label)}</a>`).join('')}</nav>
  <div class="me"><b>${esc(S.user.nama)}</b><br>${esc(S.user.role)}<br><button class="btn sm ghost" onclick="ubahPin()">Ubah PIN</button><button class="btn sm ghost" onclick="doLogout()">Keluar</button></div></aside>
  <main class="main" id="main"></main>`;
  go(items.some(m => m.id === S.page) ? S.page : items[0].id);
}
function go(p) {
  S.page = p;
  document.querySelectorAll('.side nav a').forEach(a => a.classList.toggle('on', a.dataset.p === p));
  document.querySelector('.side').classList.remove('open');
  $('#main').innerHTML = '<p class="mut">Memuat...</p>';
  run(() => PAGES[p]());
}
async function reload() { S.boot = await api('bootstrap'); }
function ubahPin() {
  openForm('Ubah PIN', [
    { k: 'pin_lama', label: 'PIN lama', type: 'password', req: true },
    { k: 'pin_baru', label: 'PIN baru (6-12 digit angka)', type: 'password', req: true }
  ], null, async o => { await api('ubahPin', o); toast('PIN diubah', 'ok'); });
}

/* ---------------------------------------------------------------- halaman */
const PAGES = {};

PAGES.dash = async () => {
  const B = S.boot, per = curPeriode();
  let lap = null; try { lap = await api('laporan', { periode: per }, { quiet: true }); } catch (e) { /* belum ada */ }
  const aktif = B.pegawai.filter(p => p.status !== 'Nonaktif');
  const noJam = aktif.filter(p => p.jam_minggu == null), noKpi = aktif.filter(p => p.kpi_terakhir == null), noMulai = aktif.filter(p => !p.mulai_manajerial);
  const noUpah = aktif.filter(p => !(Number(p.upah_saat_ini) > 0));
  const maxN = Math.max(1, ...B.struktur.map(g => aktif.filter(p => p.golongan === g.kode).length));
  $('#main').innerHTML = `<h2>Dashboard</h2>
  <div class="cards">
   <div class="card"><div class="stat">${jabAktif().length}</div><div class="statl">Jabatan manajer aktif</div></div>
   <div class="card"><div class="stat">${aktif.length}</div><div class="statl">Manajer aktif</div></div>
   <div class="card"><div class="stat">${B.struktur.length}</div><div class="statl">Golongan (${esc(B.struktur.map(g => g.kode).join(', '))})</div></div>
   <div class="card"><div class="stat">${lap ? rp(lap.total.total_bulan) : '-'}</div><div class="statl">Biaya per bulan, periode ${per}${lap ? '' : ' (belum ada penetapan)'}</div></div>
  </div>
  <div class="grid2">
   <div class="card"><h3>Sebaran manajer per golongan</h3>${B.struktur.map(g => { const n = aktif.filter(p => p.golongan === g.kode).length; return `<div style="margin:8px 0"><b>${esc(g.kode)}</b> <small>${rp(g.min)} - ${rp(g.max)}</small> <span style="float:right">${n} orang</span><div class="bar"><i style="width:${n / maxN * 100}%"></i></div></div>`; }).join('')}</div>
   <div class="card"><h3>Kelengkapan data</h3>
    <p>${noJam.length ? `<span class="pos-bawah">${noJam.length}</span>` : '0'} manajer belum punya jadwal jam kerja ${noJam.length ? '(dihitung jam penuh)' : ''}</p>
    <p>${noKpi.length ? `<span class="pos-bawah">${noKpi.length}</span>` : '0'} manajer belum punya skor KPI ${noKpi.length ? '(tukin 0)' : ''}</p>
    <p>${noMulai.length ? `<span class="pos-bawah">${noMulai.length}</span>` : '0'} manajer belum diisi tanggal mulai manajerial</p>
    <p>${noUpah.length ? `<span class="pos-bawah">${noUpah.length}</span>` : '0'} manajer belum diisi upah saat ini (tidak bisa dibandingkan)</p>
    ${lap ? `<h3 style="margin-top:14px">Posisi upah saat ini terhadap skala</h3><p>Di bawah range: <b class="pos-bawah">${lap.posisi['Di bawah range'] || 0}</b> &nbsp; Dalam range: <b class="pos-dalam">${lap.posisi['Dalam range'] || 0}</b> &nbsp; Di atas range: <b class="pos-atas">${lap.posisi['Di atas range'] || 0}</b></p>
    <p>Kebutuhan penyesuaian ke batas bawah: <b>${rp(lap.kebutuhan_penyesuaian_tahun)}</b> per tahun (13 bulan)</p>` : ''}
   </div>
  </div>
  ${lap && lap.uji ? `<div class="${lap.uji.status === 'Dalam batas' ? 'info' : 'note'}">Uji kemampuan: biaya manajer ${pct(lap.uji.porsi)} dari biaya SDM RS (batas ${pct(lap.uji.batas)}). Status: <b>${esc(lap.uji.status)}</b></div>` : ''}`;
};

PAGES.struktur = async () => {
  const B = S.boot, c = B.cfg;
  const jabPer = k => jabAktif().filter(j => j.golongan === k).map(j => esc(j.nama)).join('<br>') || '-';
  $('#main').innerHTML = `<div class="row noprint"><h2 style="margin:0;flex:1">Struktur & Skala Upah Manajer</h2><button class="btn ghost" onclick="window.print()">Cetak</button></div>
  <p class="mut">Upah Tetap per bulan untuk jam kerja penuh (${c.jam_standar} jam/minggu). Acuan UMK Brebes 2026: ${rp(c.umk)}. Upah dibayar = nilai skala x faktor jam kerja.</p>
  <h3>Rentang upah per golongan</h3><div class="wrap"><table class="stk"><tr><th>Golongan</th><th class="c">Poin</th><th class="c">Spread</th><th class="r">Terkecil</th><th class="r">Midpoint</th><th class="r">Terbesar</th><th class="c">x UMK</th><th class="c">Naik midpoint</th><th class="c">Tumpang tindih</th><th>Jabatan</th></tr>
  ${B.struktur.map(g => `<tr><td><b>${esc(g.kode)}</b></td><td class="c">${g.poin_min}-${g.poin_max}</td><td class="c">${pct(g.spread, 0)}</td><td class="r">${num(g.min)}</td><td class="r"><b>${num(g.mid)}</b></td><td class="r">${num(g.max)}</td><td class="c">${g.rasio_umk.min.toFixed(2)} - ${g.rasio_umk.max.toFixed(2)}</td><td class="c">${g.kenaikan_mid ? pct(g.kenaikan_mid) : '-'}</td><td class="c">${g.kenaikan_mid ? pct(g.tumpang_tindih, 0) : '-'}</td><td>${jabPer(g.kode)}</td></tr>`).join('')}</table></div>
  <h3>Skala 7 step (Upah Tetap, Rp per bulan, jam penuh)</h3><div class="wrap"><table class="stk"><tr><th>Golongan</th>${[1, 2, 3, 4, 5, 6, 7].map(i => `<th class="r">Step ${i}</th>`).join('')}</tr>
  ${B.struktur.map(g => `<tr><td><b>${esc(g.kode)}</b></td>${g.steps.map(v => `<td class="r">${num(v)}</td>`).join('')}</tr>`).join('')}</table></div>
  <h3>Rincian skala: gaji pokok, tunjangan jabatan, dan tukin maksimum (Rp per bulan, jam penuh)</h3>
  <p class="mut">Gaji pokok minimal ${pct(c.porsi_gapok, 0)} dari upah manajerial (dasar iuran BPJS, THR, pesangon); sisanya tunjangan jabatan (tunjangan manajer). Tukin variabel, dibayar sesuai KPI hingga batas maksimum per golongan. Tunjangan profesi dokter ada di tabel skala profesi di bawah.</p>
  <div class="wrap"><table class="stk"><tr><th>Golongan</th><th>Komponen</th>${[1, 2, 3, 4, 5, 6, 7].map(i => `<th class="r">Step ${i}</th>`).join('')}</tr>

let JAB = [];
function jabPoin(row) { return Math.round(S.boot.faktor.reduce((s, f, i) => s + Number(f.bobot) * Number(row['f' + (i + 1)] || 0), 0) * 200); }
function jabGol(p) { let k = S.boot.struktur[0].kode; S.boot.struktur.forEach(g => { if (p >= g.poin_min) k = g.kode; }); return k; }
function jabRowHtml(j, i) {
  const ed = can('HRD');
  const sel = n => `<td class="c"><select ${ed ? '' : 'disabled'} onchange="jabChange(${i},${n},this.value)">${[1, 2, 3, 4, 5].map(v => `<option ${Number(j['f' + n]) === v ? 'selected' : ''}>${v}</option>`).join('')}</select></td>`;
  return `<tr id="jr${i}"><td>${ed ? `<input value="${esc(j.nama)}" onchange="JAB[${i}].nama=this.value" style="width:100%;min-width:170px">` : esc(j.nama)}<br>${ed ? `<input value="${esc(j.unit)}" placeholder="Unit" onchange="JAB[${i}].unit=this.value" style="width:110px">
  <select onchange="JAB[${i}].jenis=this.value" style="width:auto"><option ${j.jenis === 'Non-medis' ? 'selected' : ''}>Non-medis</option><option ${j.jenis === 'Medis' ? 'selected' : ''}>Medis</option></select>` : `<small>${esc(j.unit)} - ${esc(j.jenis)}</small>`}</td>
  ${[1, 2, 3, 4, 5, 6, 7, 8].map(sel).join('')}<td class="c"><input type="number" min="50" max="200" step="5" ${ed ? '' : 'disabled'} value="${Math.round((Number(j.faktor_upah) > 0 ? Number(j.faktor_upah) : 1) * 100)}" onchange="JAB[${i}].faktor_upah=Number(this.value)/100" style="width:75px"></td><td class="c"><input type="number" min="0" step="50000" placeholder="otomatis" ${ed ? '' : 'disabled'} value="${j.tunj_jabatan_nominal === '' || j.tunj_jabatan_nominal == null ? '' : j.tunj_jabatan_nominal}" onchange="JAB[${i}].tunj_jabatan_nominal=this.value===''?'':Number(this.value)" style="width:110px"></td><td class="c" id="jp${i}"><b>${jabPoin(j)}</b></td><td class="c" id="jg${i}"><b>${jabGol(jabPoin(j))}</b></td>
  <td class="c">${ed ? `<button class="btn sm" onclick="jabSave(${i})">Simpan</button>${j.id ? ` <button class="btn sm ghost" onclick="jabToggle(${i})">${j.aktif === 'N' ? 'Aktifkan' : 'Nonaktifkan'}</button> <button class="btn sm warn" onclick="jabHapus(${i})">Hapus</button>` : ''}` : (j.aktif === 'N' ? 'Nonaktif' : '')}</td></tr>`;
}

  JAB = S.boot.jabatan.map(j => Object.assign({}, j));

  $('#main').innerHTML = `<h2>Evaluasi Jabatan (metode poin faktor)</h2>
  <p class="mut">Nilai tiap jabatan pada ${F.length} faktor (level 1 rendah sampai 5 sangat tinggi). Poin = jumlah (bobot x level) x 200, maksimum 1.000. Golongan terisi otomatis dari ambang poin. Kolom <b>Skala (%)</b> menyesuaikan seluruh skala upah jabatan (gaji pokok, tunjangan, tukin maks) terhadap golongannya, mis. 125% untuk kepala instalasi. Skor adalah usulan awal; validasi dengan panel (Direktur, Wadir, HRD, Keuangan).</p>
  <div class="wrap"><table id="jtab" class="stk"><tr><th>Jabatan</th>${F.map(f => `<th class="c" title="${esc(f.deskripsi)}">${esc(f.nama)}<br>${pct(f.bobot, 0)}</th>`).join('')}<th class="c" title="Penyesuaian skala golongan untuk jabatan ini. 100% = sama dengan skala golongan; 125% = 25% lebih tinggi (mis. kepala instalasi)">Skala (%)</th><th class="c" title="Nominal tunjangan jabatan (Rp per bulan, jam penuh), dipotong dari upah skala. Kosong = otomatis (sisa setelah porsi gaji pokok). Dibatasi agar gaji pokok tidak di bawah porsi minimum.">Tunj. jabatan (Rp)</th><th class="c">Poin</th><th class="c">Gol.</th><th></th></tr>

function hasilHtml(h) {
  const pf = h.profesi, tot0 = h.upah_tetap + h.tukin + h.tunj_profesi + (h.tunj_status || 0);
  let kal = '';
  if (h.total_saat_ini > 0) {
    kal = `<div class="${h.selisih_skala >= 0 ? 'info' : 'note'}">Total penghasilan saat ini ${rp(h.total_saat_ini)}. Skala menghasilkan ${rp(tot0)}, selisih <b>${h.selisih_skala >= 0 ? '+' : ''}${rp(h.selisih_skala)}</b>${h.tunj_penyesuaian > 0 ? `, ditutup tunjangan penyesuaian ${rp(h.tunj_penyesuaian)} agar tidak turun` : ''}.`
      + (pf ? (pf.basis === 'BULAN' ? ` Tunjangan profesi yang pas dengan angka saat ini: <b>${rp(h.total_saat_ini - h.upah_tetap - h.tukin - (h.tunj_status || 0))}</b> per bulan; hasil skala: <b>${rp(h.tunj_profesi)}</b>.` : ` Tarif jam profesi yang pas dengan angka saat ini: <b>${rp((h.total_saat_ini - h.upah_tetap - h.tukin - (h.tunj_status || 0)) / pf.jam_bulan)}</b> per jam; tarif skala: <b>${rp(pf.tarif_jam)}</b>.`) : '') + '</div>';
  }
  const T = h.total_remunerasi, pc = v => T > 0 ? (Math.round(v / T * 1000) / 10).toLocaleString('id-ID') + '%' : '-';
  const komp = `<p class="mut">Komposisi total penghasilan: gaji pokok ${pc(h.gaji_pokok)}, tunjangan manajer ${pc(h.tunj_jabatan)}, tunjangan status ${pc(h.tunj_status || 0)}, tunjangan profesi ${pc(h.tunj_profesi)}, tukin ${pc(h.tukin)}, tunjangan beban kerja ${pc(h.tunj_beban || 0)}, penyesuaian ${pc(h.tunj_penyesuaian)}.</p>`;
  return `<div class="cards">
  <div class="card"><div class="statl">Golongan / Step</div><div class="stat">${esc(h.golongan)} / Step ${h.step}</div><small>${esc(h.jabatan)} (${h.poin_jabatan} poin)</small></div>
  <div class="card"><div class="statl">Faktor jam kerja</div><div class="stat">${h.faktor_jam.toFixed(3)}</div><small>${h.jam_minggu} jam/minggu. ${esc(h.cek_jam)}</small></div>
  <div class="card"><div class="statl">Total penghasilan (sebelum potongan)</div><div class="stat">${rp(h.total_remunerasi)}</div><small>Upah tetap ${rp(h.upah_tetap)}${pf ? ', profesi ' + rp(h.tunj_profesi) : ''}</small></div>
  <div class="card"><div class="statl">Total biaya RS / bulan</div><div class="stat">${rp(h.total_bulan)}</div><small>Per tahun (12 bln + THR): ${rp(h.biaya_tahun)}</small></div></div>${kal}
  <div class="wrap"><table><tr><th>Komponen</th><th class="r">Jam penuh</th><th class="r">Dibayar</th></tr>
  <tr><td>Gaji pokok</td><td class="r">${num(h.gapok_fte)}</td><td class="r">${num(h.gaji_pokok)}</td></tr>
  <tr><td>Tunjangan jabatan</td><td class="r">${num(h.tunj_fte)}</td><td class="r">${num(h.tunj_jabatan)}</td></tr>
  <tr class="tot"><td>Lapis 1: Upah manajerial (tetap)</td><td class="r">${num(h.upah_fte)}</td><td class="r">${num(h.upah_tetap)}</td></tr>
  <tr><td>Tunjangan kinerja<br><small>maks ${num(h.tukin_max)} (${Math.round(h.tukin_pct * 1000) / 10}% upah manajerial) x faktor KPI ${Math.round(h.faktor_kpi * 100)}%</small></td><td class="r"></td><td class="r">${num(h.tukin)}</td></tr>
  ${Number(h.tunj_status) > 0 ? `<tr><td>Tunjangan status kepegawaian (${esc(h.status_kepeg)})</td><td class="r"></td><td class="r">${num(h.tunj_status)}</td></tr>` : ''}
  ${pf ? `<tr class="tot"><td>Lapis 2: Tunjangan profesi dokter<br><small>${pf.basis === 'BULAN' ? esc(pf.nama) + ', step ' + pf.step + ': ' + rp(pf.tarif_jam) + ' per bulan x faktor jam ' + h.faktor_jam.toFixed(3) : esc(pf.nama) + ', step ' + pf.step + ': ' + rp(pf.tarif_jam) + '/jam x ' + pf.jam_bulan.toFixed(1) + ' jam/bulan (' + pf.jam_minggu + ' jam/minggu)'}</small></td><td class="r"></td><td class="r">${num(h.tunj_profesi)}</td></tr>` : ''}
  ${Number(h.tunj_beban) > 0 ? `<tr><td>Tunjangan beban kerja<br><small>tambahan di atas total terlindungi</small></td><td class="r"></td><td class="r">${num(h.tunj_beban)}</td></tr>` : ''}
  ${h.tunj_penyesuaian > 0 ? `<tr class="tot"><td>Lapis 3: Tunjangan penyesuaian (perlindungan transisi)</td><td class="r"></td><td class="r">${num(h.tunj_penyesuaian)}</td></tr>` : ''}

  <tr><td>BPJS pemberi kerja: Kesehatan ${num(h.bpjs.kes)}, JHT ${num(h.bpjs.jht)}, JP ${num(h.bpjs.jp)}, JKK ${num(h.bpjs.jkk)}, JKM ${num(h.bpjs.jkm)}</td><td class="r"></td><td class="r">${num(h.bpjs.total)}</td></tr>
  <tr class="tot"><td>Total biaya RS per bulan</td><td class="r"></td><td class="r">${num(h.total_bulan)}</td></tr></table></div>
  ${komp}
  <p class="mut">Tarif per jam golongan manajerial: ${rp(h.tarif_jam)}. Compa-ratio terhadap midpoint: ${h.compa.toFixed(2)}. Rentang golongan disesuaikan jam: ${rp(h.range_jam.min)} - ${rp(h.range_jam.max)}. Poin step: ${h.poin_step.manual ? 'manual' : `pendidikan ${h.poin_step.pend}, masa kerja ${h.poin_step.masa}, sertifikasi ${h.poin_step.sert}, kinerja ${h.poin_step.kin}`}.</p>`;
}

const c0 = () => S.boot.cfg;
function skalaSurat(r, g) {
  const jb = (S.boot.jabatan || []).filter(j => j.nama === r.jabatan)[0], fj = jb && Number(jb.faktor_upah) > 0 ? Number(jb.faktor_upah) : 1;
  g = Object.assign({}, g, { steps: g.steps.map(v => Math.round(v * fj / c0().pembulatan) * c0().pembulatan) });
  const c = S.boot.cfg, st = Number(r.step), pf = (S.boot.profesi || []).filter(p => p.kode === r.profesi)[0], sp = Number(r.step_profesi);
  const nomJ = jb && jb.tunj_jabatan_nominal !== '' && jb.tunj_jabatan_nominal != null ? Math.round(Number(jb.tunj_jabatan_nominal) / c.pembulatan) * c.pembulatan : null;
  const gp = g.steps.map(v => { const gm = Math.ceil(v * c.porsi_gapok / c.pembulatan - 1e-9) * c.pembulatan; return nomJ === null ? gm : v - Math.max(0, Math.min(nomJ, v - gm)); });
  const sel = (i, cur) => i + 1 === cur ? 'background:#e6eef5;font-weight:bold;' : '';
  const th = n => [1, 2, 3, 4, 5, 6, 7].map(i => `<th style="${sel(i - 1, n)}">Step ${i}</th>`).join('');
  const row = (lbl, arr, cur, b) => `<tr><td>${lbl}</td>${arr.map((v, i) => `<td align="right" style="${sel(i, cur)}${b ? 'font-weight:bold;' : ''}">${num(v)}</td>`).join('')}</tr>`;
  return `<p style="margin:10px 0 4px"><b>Struktur dan skala upah golongan ${esc(g.kode)}${fj !== 1 ? ' untuk jabatan ' + esc(r.jabatan) + ' (' + Math.round(fj * 100) + '% dari skala golongan)' : ''}</b> <span style="font-size:11px">(jam penuh, Rp per bulan; posisi Saudara ditebalkan: step ${st})</span></p>
  <table style="border-collapse:collapse;width:100%;font-size:11px" border="1" cellpadding="3"><tr><th>Komponen</th>${th(st)}</tr>
  ${row('Gaji pokok', gp, st)}${row('Tunjangan jabatan', g.steps.map((v, i) => v - gp[i]), st)}${row('Upah manajerial', g.steps, st, true)}
  ${row('Tukin maksimum (' + Math.round(g.tukin_pct * 1000) / 10 + '%)', g.steps.map(v => Math.round(v * g.tukin_pct / c.pembulatan_jam) * c.pembulatan_jam), st)}</table>
  ${r.profesi && pf ? `<p style="margin:10px 0 4px"><b>Skala tunjangan profesi ${esc(pf.nama)}</b> <span style="font-size:11px">(${pf.basis === 'BULAN' ? 'tetap per bulan, jam penuh' : 'tarif per jam'}; step menurut lama praktik, posisi Saudara: step ${sp})</span></p>
  <table style="border-collapse:collapse;width:100%;font-size:11px" border="1" cellpadding="3"><tr><th>Kualifikasi</th>${th(sp)}</tr>${row(esc(pf.nama), pf.steps, sp)}</table>` : ''}`;
}
function suratHtml(r, rs, g) {

function parseLines(txt, n) {
  return txt.split(/\r?\n/).map(l => l.trim()).filter(l => l && !/^nip/i.test(l)).map(l => l.split(/[;\t,]/).map(s => s.trim())).filter(a => a.length >= n);
}

  };
};
window.fbTotal = () => { let t = 0; document.querySelectorAll('.fb').forEach(i => { t += Number(i.value || 0); }); const e = $('#fbt'); e.innerHTML = `<b class="${Math.abs(t - 100) < 0.01 ? 'pos-dalam' : 'pos-bawah'}">${t.toFixed(1)}</b>`; };
window.fbSimpan = () => run(async () => {
  const rows = Array.from(document.querySelectorAll('.fb')).map(i => ({ id: i.dataset.id, bobot: Number(i.value) / 100 }));
  await api('saveFaktor', { rows }); await reload(); toast('Bobot tersimpan', 'ok'); PAGES.setting();
});
function gRender() {
  const su = can();
  $('#gtab').innerHTML = `<tr><th>Kode</th><th>Poin minimum</th><th>Spread (%)</th><th>Tukin maks (%), kosong = bawaan</th>${su ? '<th></th>' : ''}</tr>${GOLS.map((g, i) => `<tr><td><input value="${esc(g.kode)}" ${su ? '' : 'disabled'} onchange="GOLS[${i}].kode=this.value" style="width:90px"></td><td><input type="number" value="${g.poin_min}" ${su ? '' : 'disabled'} onchange="GOLS[${i}].poin_min=Number(this.value)" style="width:110px"></td><td><input type="number" step="1" value="${Math.round(g.spread * 100)}" ${su ? '' : 'disabled'} onchange="GOLS[${i}].spread=Number(this.value)/100" style="width:100px"></td><td><input type="number" step="1" min="0" max="100" placeholder="${Math.round(S.boot.cfg.tukin_max * 100)}" value="${g.tukin_max === '' ? '' : Math.round(g.tukin_max * 1000) / 10}" ${su ? '' : 'disabled'} onchange="GOLS[${i}].tukin_max=this.value===''?'':Number(this.value)/100" style="width:110px"></td>${su ? `<td><button class="btn sm ghost" onclick="gDel(${i})">Hapus</button></td>` : ''}</tr>`).join('')}`;
}
window.gAdd = () => { GOLS.push({ kode: 'M' + (GOLS.length + 1), poin_min: 900, spread: 0.7, tukin_max: '' }); gRender(); };
window.gDel = i => { GOLS.splice(i, 1); gRender(); };
window.gSimpan = () => run(async () => { await api('saveGolongan', { rows: GOLS }); await reload(); toast('Golongan tersimpan', 'ok'); PAGES.setting(); });
function pRender() {
  $('#ptab').innerHTML = `<tr><th>Kode</th><th>Kualifikasi</th><th>Basis</th><th>Cara isi step</th><th>Nilai terkecil (Rp)</th><th>Nilai terbesar (Rp)</th><th></th></tr>${PROF.map((p, i) => `<tr><td><input value="${esc(p.kode)}" onchange="PROF[${i}].kode=this.value" style="width:80px"></td><td><input value="${esc(p.nama)}" onchange="PROF[${i}].nama=this.value" style="min-width:180px"></td><td><select onchange="PROF[${i}].basis=this.value"><option value="JAM" ${p.basis !== 'BULAN' ? 'selected' : ''}>Per jam</option><option value="BULAN" ${p.basis === 'BULAN' ? 'selected' : ''}>Tetap per bulan</option></select></td><td><select onchange="pMode(${i},this.value)"><option value="0" ${!p.manual ? 'selected' : ''}>Rentang otomatis</option><option value="1" ${p.manual ? 'selected' : ''}>Isi per step</option></select></td><td><input type="number" step="1000" value="${p.manual ? p.steps[0] : p.tarif_min}" ${p.manual ? 'disabled' : ''} onchange="PROF[${i}].tarif_min=Number(this.value)" style="width:140px"></td><td><input type="number" step="1000" value="${p.manual ? p.steps[6] : p.tarif_max}" ${p.manual ? 'disabled' : ''} onchange="PROF[${i}].tarif_max=Number(this.value)" style="width:140px"></td><td><button class="btn sm ghost" onclick="pDel(${i})">Hapus</button></td></tr>${p.manual ? `<tr><td colspan="7" style="background:#f4f7f9"><div class="row" style="gap:6px;flex-wrap:wrap;align-items:center"><b>Nilai tiap step (naik tiap lama praktik):</b>${[0, 1, 2, 3, 4, 5, 6].map(k => `<label class="fld" style="margin:0"><span>Step ${k + 1}</span><input type="number" step="1000" value="${p.steps[k]}" onchange="PROF[${i}].steps[${k}]=Number(this.value)" style="width:120px"></label>`).join('')}<label class="fld" style="margin:0"><span>Samakan semua</span><input type="number" step="1000" placeholder="mis. 60000" style="width:120px" onchange="pSama(${i},this.value)"></label></div></td></tr>` : ''}`).join('')}`;
}
window.pMode = (i, v) => {
  const p = PROF[i];
  if (v === '1') { p.manual = true; const mn = Number(p.tarif_min), mx = Number(p.tarif_max); p.steps = [0, 1, 2, 3, 4, 5, 6].map(k => Math.round((mn + (mx - mn) * k / 6) / 1000) * 1000); }
  else { p.manual = false; p.tarif_min = p.steps[0] || p.tarif_min; p.tarif_max = p.steps[6] || p.tarif_max; }
  pRender();
};
window.pSama = (i, v) => { const n = Number(v); if (n > 0) { PROF[i].steps = [0, 1, 2, 3, 4, 5, 6].map(() => n); pRender(); } };
window.pAdd = () => { PROF.push({ kode: 'DX', nama: 'Kualifikasi baru', basis: 'JAM', tarif_min: 50000, tarif_max: 70000, manual: false, steps: [] }); pRender(); };
window.pDel = i => { PROF.splice(i, 1); pRender(); };
window.pSimpan = () => run(async () => { await api('saveProfesi', { rows: PROF.map(p => ({ kode: p.kode, nama: p.nama, basis: p.basis, tarif_min: p.tarif_min, tarif_max: p.tarif_max, step_manual: p.manual ? p.steps : [] })) }); await reload(); toast('Skala profesi tersimpan', 'ok'); PAGES.setting(); });

/* ---- Pengguna & audit */
PAGES.pengguna = async () => {
  const us = await api('listUsers'), au = await api('audit'); window._us = us;
  $('#main').innerHTML = `<div class="row"><h2 style="margin:0;flex:1">Pengguna & Audit</h2><button class="btn" onclick="usForm()">+ Tambah pengguna</button></div>
  <div class="wrap"><table><tr><th>Username</th><th>Nama</th><th>Peran</th><th>Tertaut ke manajer</th><th>Aktif</th><th></th></tr>
  ${us.map((u, i) => `<tr><td>${esc(u.username)}</td><td>${esc(u.nama)}</td><td>${esc(u.role)}</td><td>${esc((S.boot.pegawai.filter(p => p.id === u.pegawai_id)[0] || {}).nama || '')}</td><td>${u.aktif}</td><td><button class="btn sm" onclick="usForm(${i})">Edit</button></td></tr>`).join('')}</table></div>
  <h3>Audit (200 terakhir)</h3><div class="wrap"><table><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Detail</th></tr>${au.map(a => `<tr><td>${esc(a.waktu)}</td><td>${esc(a.user)}</td><td>${esc(a.aksi)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</table></div>`;
};
window.usForm = u => {
  u = typeof u === 'number' ? window._us[u] : (u || { role: 'HRD', aktif: 'Y' });
  openForm(u.id ? 'Edit pengguna' : 'Tambah pengguna', [
    { k: 'username', label: 'Username', req: true }, { k: 'nama', label: 'Nama', req: true },
    { k: 'role', label: 'Peran', type: 'select', opts: ['HRD', 'Keuangan', 'Wadir', 'Direktur', 'Manajer', 'SuperAdmin'].map(r => [r, r]) },
    { k: 'pegawai_id', label: 'Tautkan ke manajer (peran Manajer)', type: 'select', opts: [['', '-']].concat(S.boot.pegawai.map(p => [p.id, p.nama])) },
    { k: 'pin', label: u.id ? 'PIN baru (kosongkan bila tidak diubah)' : 'PIN awal (6-12 digit)', type: 'password' },
    { k: 'aktif', label: 'Aktif', type: 'select', opts: [['Y', 'Ya'], ['N', 'Tidak']] }
  ], u, async o => { if (u.id) o.id = u.id; await api('saveUser', o); toast('Tersimpan', 'ok'); PAGES.pengguna(); });
};

/* ---- Akun manajer */
PAGES.saya = async () => {
  const d = await api('saya'), g = d.golongan;
  $('#main').innerHTML = `<h2>Data Saya</h2><div class="card"><h3>${esc(d.nama)}</h3><p>${esc(d.jabatan)}${g ? ` - Golongan ${esc(g.kode)}` : ''}<br><small>NIP ${esc(d.nip)}</small></p>
  ${g ? `<p>Rentang upah golongan (jam penuh): <b>${rp(g.min)}</b> sampai <b>${rp(g.max)}</b>, midpoint ${rp(g.mid)}.</p>` : ''}
  ${d.jadwal ? `<p>Jadwal jam kerja berlaku ${esc(d.jadwal.berlaku_mulai)}: ${D.map((k, i) => DN[i] + ' ' + d.jadwal[k]).join(', ')}.</p>` : '<p class="mut">Jadwal jam kerja belum diisi.</p>'}</div>
  <h3>Penetapan upah yang telah disetujui</h3><div class="wrap"><table><tr><th>Periode</th><th>Gol / Step</th><th class="c">Jam</th><th class="r">Gaji pokok</th><th class="r">Tunjangan jabatan</th><th class="r">Upah tetap</th><th class="r">Tunj. profesi</th><th class="r">Penyesuaian</th><th class="r">Total penghasilan</th><th>No SK</th><th></th></tr>
  ${d.penetapan.map((r, i) => `<tr><td>${esc(r.periode)}</td><td>${esc(r.golongan)} / ${r.step}</td><td class="c">${r.jam_minggu}</td><td class="r">${num(r.gaji_pokok)}</td><td class="r">${num(r.tunj_jabatan)}</td><td class="r"><b>${num(r.upah_tetap)}</b></td><td class="r">${r.profesi ? num(r.tunj_profesi) : '-'}</td><td class="r">${Number(r.tunj_penyesuaian) > 0 ? num(r.tunj_penyesuaian) : '-'}</td><td class="r"><b>${num(Number(r.upah_tetap) + Number(r.tukin) + Number(r.tunj_profesi || 0) + Number(r.tunj_penyesuaian || 0))}</b></td><td>${esc(r.sk_no)}</td><td><button class="btn sm ghost" onclick="sayaCetak(${i})">Cetak</button></td></tr>`).join('') || '<tr><td colspan="11" class="mut">Belum ada penetapan yang disetujui.</td></tr>'}</table></div>`;
  window._saya = d;
};
window.sayaCetak = i => {
  const d = window._saya, r = d.penetapan[i], w = window.open('', '_blank'); if (!w) return toast('Pop-up diblokir browser', 'err');
  w.document.write('<html><head><title>Pemberitahuan Upah</title></head><body>' + suratHtml(r, d.nama_rs, d.golongan) + '</body></html>');
  w.document.close(); w.focus(); setTimeout(() => w.print(), 400);
};

/* ---------------------------------------------------------------- mulai */
(async function init() {
  if (S.token && S.user) { try { await start(); } catch (e) { logoutLocal(); toast(e.message, 'err'); } }
  else showLogin();
})();
</script>
</body>
</html>
